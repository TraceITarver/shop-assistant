<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141518"><title>Shop Assistant</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><link rel="stylesheet" href="style.css"></head><body>
<header><img src="icons/icon-192.png" alt=""><h1>Shop Assistant</h1>
<button id="installBtn" class="btn accent" hidden>Install</button><button id="menuBtn" class="btn" aria-label="Backup menu">⋮</button></header>
<div id="menu" class="menu" hidden><button data-act="backup">Download full backup (JSON)</button><button data-act="restore">Restore from backup</button><button data-act="csv">Export this tab to CSV</button><input type="file" id="restoreFile" accept=".json,application/json" hidden></div>
<div id="iosTip" class="tip" hidden>To install on iPhone: tap Share, then “Add to Home Screen”. <button class="x" onclick="this.parentNode.hidden=true">✕</button></div>
<main id="main"></main>
<button id="fab" class="fab" aria-label="Add">＋</button>
<nav><button data-tab="jobs" class="on">🔧<span>Job Log</span></button><button data-tab="tools">🧰<span>Tools</span></button><button data-tab="manuals">📘<span>Manuals</span></button></nav>
<dialog id="dlg"><form id="form" method="dialog"></form></dialog>
<script src="app.js"></script></body></html>
